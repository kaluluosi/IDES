{# 覆盖 material 的 copyright partial，追加备案号（仅当 extra.beian 非空时显示） #}
<div class="md-copyright">
  {% if config.copyright %}
    <div class="md-copyright__highlight">
      {{ config.copyright }}
    </div>
  {% endif %}
  {% if not config.extra.generator == false %}
    Made with
    <a href="https://squidfunk.github.io/mkdocs-material/" target="_blank" rel="noopener">
      Material for MkDocs
    </a>
  {% endif %}
  {% if config.extra.beian %}
    <div class="md-copyright__beian" style="margin-top: 0.4em;">
      <a href="{{ config.extra.beian_link | default('https://beian.miit.gov.cn') }}" target="_blank" rel="noopener">
        {{ config.extra.beian }}
      </a>
    </div>
  {% endif %}
</div>
