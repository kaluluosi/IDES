site_name: IDES
site_description: rust native memory ai agent harness / RUST原生记忆AI智能体底座
site_url: https://kaluluosi.github.io/IDES/

# ========== 首页 = 官网原样静态页 ==========
# docs/index.html + index-en.html + terminal.css/js 原样复制到 site 根，官网占 /
# 文档区 = mkdocs-material 渲染，docs/zh + docs/en 各语言独立子目录
# 语言切换器 = material 原生 extra.alternate

theme:
  name: material
  palette:
    scheme: slate
    primary: amber
    accent: amber
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
  language: zh

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences

plugins:
  - search

# 官网静态页（index.html）不进 nav，文档区按语言子目录真实路径
# material 原生多语言：每语言一个子目录，nav 用带路径文件名
nav:
  - 什么是 IDES: zh/index.md
  - 快速开始: zh/quickstart.md
  - 使用 IDES: zh/using-ides.md
  - 内置工具: zh/builtin-tools.md
  - GNM 记忆详解: zh/gnm.md
  - 强袭挂件: zh/equipment.md
  - 影分身: zh/afterimage.md
  - 感知与通讯: zh/perception-comm.md
  - IDES TEAM: zh/team.md

# 语言切换器（material 原生 alternate，右上角）
extra:
  alternate:
    - name: English
      link: https://kaluluosi.github.io/IDES/en/
      lang: en
    - name: 简体中文
      link: https://kaluluosi.github.io/IDES/zh/
      lang: zh
